<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
       content="width=device-width, initial-scale=1.0">
    <title>Gallery | Paws of Hope</title>
    <meta name="description"
       content="View rescued animals and activities from Paws of Hope.">
    <meta name="keywords"
       content="animal gallery, rescued animals, animal charity">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
    <a href="../index.html" class="logo">
      <img src="../images/logo.png"
           alt="Paws of Hope logo">
    </a>
      <button class="menu-toggle" id="menuToggle"
       aria-label="Open navigation menu">
        ☰
      </button>
      <nav id="mainNav">
        <a href="../index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact Us</a>
      <button id="themeToggle"
      class="theme-button"
      aria-label="Toggle dark mode">
      🌙
      </button>
      </nav>
    </header>
    <main>
    <section class="page-hero">
      <p class="section-label">OUR HAPPY MOMENTS</p>
      <h1>Our Gallery</h1>
      <p>
        A glimpse of the animals we rescue and
        the people who support our mission.
      </p>
    </section>
    <section class="section">
    <div class="filter-buttons">
      <button class="filter-btn active"
        data-filter="all">
        All
      </button>
      <button class="filter-btn"
        data-filter="animals">
        Rescued Animals
      </button>
      <button class="filter-btn"
        data-filter="events">
        Events
      </button>
    </div>
    <div class="gallery-grid">
      <button class="gallery-item animals"
        data-image="../images/gallery1.jpg"
        aria-label="View rescued dog">
        <img src="../images/gallery1.jpg"
             alt="Rescued dog">
      </button>
      <button class="gallery-item animals"
        data-image="../images/gallery2.jpg"
        aria-label="View rescued cat">
        <img src="../images/gallery2.jpg"
             alt="Rescued cat">
      </button>
      <button class="gallery-item animals"
        data-image="../images/gallery3.jpg"
        aria-label="View rescued puppy">
        <img src="../images/gallery3.jpg"
             alt="Rescued puppy">
      </button>
      <button class="gallery-item events"
        data-image="../images/gallery4.jpg"
        aria-label="View charity activity">
        <img src="../images/gallery4.jpg"
             alt="Animal charity activity">
      </button>
      <button class="gallery-item events"
        data-image="../images/gallery5.jpg"
        aria-label="View adoption event">
        <img src="../images/gallery5.jpg"
             alt="Pet adoption event">
      </button>
      <button class="gallery-item animals"
        data-image="../images/gallery6.jpg"
        aria-label="View rescued animal">
        <img src="../images/gallery6.jpg"
             alt="Rescued animal">
      </button>
      <button class="gallery-item events"
        data-image="../images/gallery7.jpg"
        aria-label="View volunteer activity">
        <img src="../images/gallery7.jpg"
             alt="Volunteer activity">
      </button>
      <button class="gallery-item animals"
        data-image="../images/gallery8.jpg"
        aria-label="View happy adopted animal">
        <img src="../images/gallery8.jpg"
             alt="Happy adopted animal">
      </button>
      <button class="gallery-item animals"
        data-image="../images/gallery9.jpg"
        aria-label="View rescued pet">
        <img src="../images/gallery9.jpg"
             alt="Rescued pet">
      </button>
    </div>
    </section>
    <!-- IMAGE MODAL -->
    <div id="imageModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Image preview">
      <button id="closeModal"
        class="close-modal"
        aria-label="Close image">
        ×
      </button>
        <img id="modalImage"
          src=""
          alt="Expanded gallery image">
    </div>
    </main>
    <footer>
    <div class="copyright">
      © 2026 Paws of Hope Animal Charity. All Rights Reserved.
    </div>
    </footer>
    <button id="backTop" class="back-top" aria-label="Back to top">
      ↑
    </button>
  </body>
</html>
